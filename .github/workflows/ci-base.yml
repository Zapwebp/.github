name: Base CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      pnpm-version:
        type: string
        default: '11.9.0'
      run-tests:
        type: boolean
        default: true
      test-script:
        type: string
        default: 'test'

jobs:
  ci:
    name: Base CI (${{ inputs.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm (with retry)
        uses: Zapwebp/.github/.github/actions/setup-pnpm-retry@main
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Verify lockfile
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        if: ${{ inputs.run-tests }}
        run: pnpm run ${{ inputs.test-script }}
